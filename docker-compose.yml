version: '3.8'

services:
  mongodb:
    image: docker.io/library/mongo:7.0
    container_name: gamenight_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: gamenight_bot
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - gamenight_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamenight_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=mongodb://admin:password@mongodb:27017/gamenight_bot?authSource=admin
      - DISCORD_TOKEN=${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required}
      - JWT_SECRET=${JWT_SECRET:-please_change_this_jwt_secret_in_production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gamenight_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: gamenight_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=mongodb://admin:password@mongodb:27017/gamenight_bot?authSource=admin
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - WEB_HOST=${WEB_HOST:-0.0.0.0}
      - WEB_PORT=${WEB_PORT:-8000}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gamenight_network

volumes:
  mongodb_data:

networks:
  gamenight_network:
    driver: bridge