{% extends "base.html" %}

{% block title %}Events - Game Night Bot{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
    <h1 class="h2">
        <i class="bi bi-calendar-event"></i>
        Events Management
    </h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group me-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="refreshEvents()">
                <i class="bi bi-arrow-clockwise"></i>
                Refresh
            </button>
        </div>
    </div>
</div>

<!-- Events Table -->
<div class="card shadow">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">
            <i class="bi bi-list"></i>
            Recent Events
        </h6>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered" id="eventsTable">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Creator</th>
                        <th>State</th>
                        <th>Created</th>
                        <th>Guild ID</th>
                    </tr>
                </thead>
                <tbody id="eventsTableBody">
                    <tr>
                        <td colspan="5" class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Loading events...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Pagination -->
<nav aria-label="Events pagination" class="mt-3">
    <ul class="pagination justify-content-center" id="pagination">
        <!-- Pagination will be populated by JavaScript -->
    </ul>
</nav>
{% endblock %}

{% block extra_js %}
<script>
let currentPage = 0;
const eventsPerPage = 20;

async function loadEvents(page = 0) {
    try {
        const skip = page * eventsPerPage;
        const response = await fetch(`/api/events?limit=${eventsPerPage}&skip=${skip}`);
        const result = await response.json();
        
        if (result.success) {
            displayEvents(result.data);
            updatePagination(result.count, page);
        } else {
            showError('Failed to load events');
        }
    } catch (error) {
        console.error('Error loading events:', error);
        showError('Error loading events');
    }
}

function displayEvents(events) {
    const tbody = document.getElementById('eventsTableBody');
    
    if (events.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="5" class="text-center text-muted">
                    <i class="bi bi-calendar-x" style="font-size: 2rem;"></i>
                    <p class="mt-2">No events found</p>
                </td>
            </tr>
        `;
        return;
    }
    
    tbody.innerHTML = events.map(event => `
        <tr>
            <td>
                <strong>${escapeHtml(event.title)}</strong>
                ${event.description ? `<br><small class="text-muted">${escapeHtml(event.description.substring(0, 100))}${event.description.length > 100 ? '...' : ''}</small>` : ''}
            </td>
            <td>
                <code>${event.creator_id}</code>
            </td>
            <td>
                <span class="badge bg-${getStateBadgeColor(event.state)}">
                    ${event.state.replace('_', ' ')}
                </span>
            </td>
            <td>
                <small>${formatDate(event.created_at)}</small>
            </td>
            <td>
                <code>${event.guild_id}</code>
            </td>
        </tr>
    `).join('');
}

function getStateBadgeColor(state) {
    const colors = {
        'DRAFT': 'secondary',
        'DATE_POLLING': 'primary',
        'TIME_POLLING': 'info',
        'GAME_POLLING': 'warning',
        'SCHEDULED': 'success',
        'COMPLETED': 'dark',
        'CANCELLED': 'danger'
    };
    return colors[state] || 'secondary';
}

function formatDate(dateString) {
    if (!dateString) return 'N/A';
    try {
        return new Date(dateString).toLocaleString();
    } catch {
        return 'Invalid Date';
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function updatePagination(count, currentPage) {
    const pagination = document.getElementById('pagination');
    const totalPages = Math.ceil(count / eventsPerPage);
    
    if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
    }
    
    let paginationHtml = '';
    
    // Previous button
    paginationHtml += `
        <li class="page-item ${currentPage === 0 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">
                <i class="bi bi-chevron-left"></i>
            </a>
        </li>
    `;
    
    // Page numbers (show max 5 pages)
    const startPage = Math.max(0, currentPage - 2);
    const endPage = Math.min(totalPages - 1, startPage + 4);
    
    for (let i = startPage; i <= endPage; i++) {
        paginationHtml += `
            <li class="page-item ${i === currentPage ? 'active' : ''}">
                <a class="page-link" href="#" onclick="changePage(${i}); return false;">
                    ${i + 1}
                </a>
            </li>
        `;
    }
    
    // Next button
    paginationHtml += `
        <li class="page-item ${currentPage >= totalPages - 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
    `;
    
    pagination.innerHTML = paginationHtml;
}

function changePage(page) {
    if (page < 0) return;
    currentPage = page;
    loadEvents(page);
}

function refreshEvents() {
    loadEvents(currentPage);
    showToast('Events refreshed!', 'success');
}

function showError(message) {
    const tbody = document.getElementById('eventsTableBody');
    tbody.innerHTML = `
        <tr>
            <td colspan="5" class="text-center text-danger">
                <i class="bi bi-exclamation-triangle" style="font-size: 2rem;"></i>
                <p class="mt-2">${message}</p>
            </td>
        </tr>
    `;
}

function showToast(message, type = 'info') {
    // Simple toast notification
    const toast = document.createElement('div');
    toast.className = `alert alert-${type === 'success' ? 'success' : 'danger'} position-fixed`;
    toast.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
    toast.innerHTML = `
        <div class="d-flex align-items-center">
            <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'} me-2"></i>
            ${message}
            <button type="button" class="btn-close ms-auto" onclick="this.parentElement.parentElement.remove()"></button>
        </div>
    `;
    
    document.body.appendChild(toast);
    
    // Auto-remove after 3 seconds
    setTimeout(() => {
        if (toast.parentElement) {
            toast.remove();
        }
    }, 3000);
}

// Load events when page loads
document.addEventListener('DOMContentLoaded', function() {
    loadEvents(0);
});
</script>
{% endblock %}
